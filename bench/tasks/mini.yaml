# Composition suite: multi-goal tasks graded per part.
compose:
  - id: pack_sales_stock
    family: compose
    goal: |
      Two chores in one run. (1) Summarize the sales CSV: return "totals" as {"by_category": {category: revenue}, "grand_total": total} and write a Markdown report listing every category. (2) From the inventory CSV list items where qty <= reorder_at as "low_stock". Return {"totals": <sales totals>, "low_stock": [...]} and write both reports.
    files: {sales_csv: sales_v1.csv, inventory_csv: stock_v1.csv}
    expected:
      parts:
        sales_summary: {by_category: {drink: 7.00, food: 9.00}, grand_total: 16.00}
        stock_alert: {low_stock: [Milk, Cups]}

  - id: pack_owner_invoice
    family: compose
    goal: |
      Two chores in one run. (1) Write an owner summary (owner_summary.md) for the sales CSV stating the date range, grand total, and top category. (2) Read the invoice PDF grand total. Return {"summary_md": path, "total": N}.
    files: {sales_csv: sales_v2.csv, invoice_pdf: invoice_v1.pdf}
    pdf_lines: ["INVOICE #1001", "Supplier: Acme Beans", "TOTAL: 214.50"]
    expected:
      parts:
        owner_summary: {contains: ["10/26/2026", "10/28/2026", "8.5", "drink"]}
        invoice_total: {total: 214.50}

  - id: pack_top_stock
    family: compose
    goal: |
      Two chores in one run. (1) Top 2 items by revenue from the items CSV as "top" ([{"item", "revenue"}] best-first). (2) From the inventory CSV list items where qty <= reorder_at as "low_stock". Return {"top": [...], "low_stock": [...]}.
    files: {items_csv: top_v1.csv, inventory_csv: stock_v2.csv}
    expected:
      parts:
        top_items: {top: [{item: Sandwich, revenue: 120.00}, {item: Latte, revenue: 70.00}]}
        stock_alert: {low_stock: [Sugar]}
